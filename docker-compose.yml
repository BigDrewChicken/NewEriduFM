services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: zzz-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      # hardware safety: small heap + short retention so disk/RAM stay bounded
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
      KAFKA_LOG_RETENTION_MS: 900000          # 15 min
      KAFKA_LOG_RETENTION_BYTES: 268435456    # 256 MB per partition (x6)
      KAFKA_LOG_SEGMENT_BYTES: 67108864       # 64 MB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
    mem_limit: 2g
  mongo:
    image: mongo:7
    container_name: zzz-mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    mem_limit: 1g
volumes:
  mongo_data:

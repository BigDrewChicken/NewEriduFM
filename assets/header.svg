<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">NEW ERIDU FM: Signal Search Big Data Pipeline</title>
  <desc id="d">Animated banner with a glitching title, a blinking ON AIR light, a moving equalizer and a scrolling ticker.</desc>
  <defs>
    <pattern id="hazard" width="40" height="14" patternUnits="userSpaceOnUse">
      <rect width="40" height="14" fill="#0a0a0a"/>
      <polygon points="0,14 14,0 27,0 13,14" fill="#E1FF00"/>
      <polygon points="27,14 40,0 54,0 40,14" fill="#E1FF00"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E1FF00" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="tickerClip"><rect x="0" y="184" width="1000" height="44"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1000" height="280" fill="#0a0a0a"/>
  <rect width="1000" height="280" fill="url(#glow)"/>

  <!-- scrolling hazard tape (top and bottom) -->
  <g>
    <rect x="-40" y="0" width="1080" height="14" fill="url(#hazard)"/>
    <rect x="-40" y="266" width="1080" height="14" fill="url(#hazard)"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="40 0" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- ON AIR light -->
  <circle cx="48" cy="46" r="7" fill="#FF3B3B">
    <animate attributeName="opacity" values="1;1;0.15;1" keyTimes="0;0.55;0.75;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#FF3B3B">ON AIR</text>
  <text x="960" y="52" text-anchor="end" font-family="'Courier New', monospace" font-size="16" letter-spacing="2" fill="#7d7d7d">FM 88.8 MHZ  //  NEW ERIDU</text>

  <!-- title with glitch layers -->
  <g font-family="Impact, 'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-weight="900" font-size="96">
    <text x="40" y="150" textLength="660" lengthAdjust="spacingAndGlyphs" fill="#00E5FF" opacity="0.75">NEW ERIDU FM
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-5 1;4 -1;0 0;0 0" keyTimes="0;0.84;0.87;0.90;0.93;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="150" textLength="660" lengthAdjust="spacingAndGlyphs" fill="#FF2D6F" opacity="0.75">NEW ERIDU FM
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;5 -1;-4 1;0 0;0 0" keyTimes="0;0.84;0.87;0.90;0.93;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="150" textLength="660" lengthAdjust="spacingAndGlyphs" fill="#E1FF00">NEW ERIDU FM</text>
  </g>


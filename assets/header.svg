    <rect x="808.5" y="139" width="10" height="11" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="11;55;13;45;23;11" dur="1.59s" repeatCount="indefinite"/><animate attributeName="y" values="139;95;137;105;127;139" dur="1.59s" repeatCount="indefinite"/></rect>
    <rect x="823.0" y="131" width="10" height="19" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="19;53;48;43;39;19" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="131;97;102;107;111;131" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="837.5" y="127" width="10" height="23" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="23;64;56;54;37;23" dur="1.38s" repeatCount="indefinite"/><animate attributeName="y" values="127;86;94;96;113;127" dur="1.38s" repeatCount="indefinite"/></rect>
    <rect x="852.0" y="133" width="10" height="17" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="17;52;22;42;46;17" dur="1.39s" repeatCount="indefinite"/><animate attributeName="y" values="133;98;128;108;104;133" dur="1.39s" repeatCount="indefinite"/></rect>
    <rect x="866.5" y="134" width="10" height="16" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="16;57;32;47;36;16" dur="1.48s" repeatCount="indefinite"/><animate attributeName="y" values="134;93;118;103;114;134" dur="1.48s" repeatCount="indefinite"/></rect>
    <rect x="881.0" y="132" width="10" height="18" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="18;70;19;60;22;18" dur="1.31s" repeatCount="indefinite"/><animate attributeName="y" values="132;80;131;90;128;132" dur="1.31s" repeatCount="indefinite"/></rect>
    <rect x="895.5" y="139" width="10" height="11" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="11;77;24;67;48;11" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="139;73;126;83;102;139" dur="1.15s" repeatCount="indefinite"/></rect>
    <rect x="910.0" y="140" width="10" height="10" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="10;52;23;42;23;10" dur="1.63s" repeatCount="indefinite"/><animate attributeName="y" values="140;98;127;108;127;140" dur="1.63s" repeatCount="indefinite"/></rect>
    <rect x="924.5" y="140" width="10" height="10" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="10;82;58;72;60;10" dur="1.18s" repeatCount="indefinite"/><animate attributeName="y" values="140;68;92;78;90;140" dur="1.18s" repeatCount="indefinite"/></rect>
    <rect x="939.0" y="131" width="10" height="19" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="19;64;62;54;36;19" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="131;86;88;96;114;131" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="953.5" y="136" width="10" height="14" fill="#E1FF00" opacity="0.9"><animate attributeName="height" values="14;73;14;63;40;14" dur="1.48s" repeatCount="indefinite"/><animate attributeName="y" values="136;77;136;87;110;136" dur="1.48s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="736" y="154" width="227.5" height="2" fill="#E1FF00" opacity="0.5"/>

  <!-- ticker bar -->
  <rect x="0" y="184" width="1000" height="44" fill="#111111"/>
  <rect x="0" y="184" width="1000" height="2" fill="#E1FF00"/>
  <rect x="0" y="226" width="1000" height="2" fill="#E1FF00"/>
  <g clip-path="url(#tickerClip)">
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" xml:space="preserve">
      <text x="0" y="214" textLength="1500" lengthAdjust="spacing">SIGNAL SEARCH BIG DATA PIPELINE  •  KAFKA  •  MONGODB  •  UP TO 10,000 EVENTS/S  •  VOLUME  •  VELOCITY  •  VARIETY  •  </text>
      <text x="1500" y="214" textLength="1500" lengthAdjust="spacing">SIGNAL SEARCH BIG DATA PIPELINE  •  KAFKA  •  MONGODB  •  UP TO 10,000 EVENTS/S  •  VOLUME  •  VELOCITY  •  VARIETY  •  </text>
